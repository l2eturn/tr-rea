<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Racer</title>
<style>
  :root {
    --bg: #020617;
    --panel: #0f172a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    width: 100%;
    max-width: 960px;
  }
  h1 {
    margin: 0;
    font-size: 17px;
    letter-spacing: 0.02em;
  }
  header span {
    font-size: 12px;
    color: var(--muted);
  }
  #stage {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
  }
  footer {
    width: 100%;
    max-width: 960px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  kbd {
    background: var(--panel);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--text);
  }
  @media (max-width: 720px) {
    header, footer { max-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>Offline Racer</h1>
  <span>client + local virtual server, fully offline</span>
</header>

<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
</div>

<footer>
  <kbd>&larr;</kbd> <kbd>&rarr;</kbd> run &nbsp;·&nbsp;
  <kbd>Space</kbd> jump (double) &nbsp;·&nbsp;
  <kbd>&darr;</kbd> slide &nbsp;·&nbsp;
  <kbd>R</kbd> restart &nbsp;·&nbsp;
  <kbd>G</kbd> ghost &nbsp;·&nbsp;
  <kbd>L</kbd> latency &nbsp;·&nbsp;
  <kbd>C</kbd>/<kbd>V</kbd> try to cheat (the local server reverts it)
</footer>

<!-- shared: identical code on both sides of the loopback -->
<script src="src/shared/constants.js"></script>
<script src="src/shared/track.js"></script>
<script src="src/shared/physics.js"></script>
<script src="src/shared/protocol.js"></script>

<!-- local virtual server -->
<script src="src/server/loopback.js"></script>
<script src="src/server/validation.js"></script>
<script src="src/server/raceState.js"></script>
<script src="src/server/aiRacers.js"></script>
<script src="src/server/raceSession.js"></script>
<script src="src/server/room.js"></script>
<script src="src/server/lobby.js"></script>
<script src="src/server/localServer.js"></script>

<!-- client -->
<script src="src/client/input.js"></script>
<script src="src/client/netClient.js"></script>
<script src="src/client/save.js"></script>
<script src="src/client/ghost.js"></script>
<script src="src/client/checkpoints.js"></script>
<script src="src/client/timeTrial.js"></script>
<script src="src/client/renderer.js"></script>
<script src="src/client/gameLoop.js"></script>

<script src="src/main.js"></script>
</body>
</html>
